<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema TI - Controle de Equipamentos e Chamados</title>
    
    <!-- CSS da Aplicação -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Ícones (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="app">
        <!-- Navegação Lateral -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-server"></i>
                <span>Sistema TI</span>
            </div>
            <nav class="menu">
                <a href="#dashboard" class="menu-item active" data-page="dashboard">
                    <i class="fa-solid fa-chart-pie"></i> Painel Principal
                </a>
                <a href="#equipamentos" class="menu-item" data-page="equipamentos">
                    <i class="fa-solid fa-laptop"></i> Equipamentos
                </a>
                <a href="#chamados" class="menu-item" data-page="chamados">
                    <i class="fa-solid fa-headset"></i> Chamados
                </a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="content">
            <header class="topbar">
                <h2>Controle de TI</h2>
                <div class="user-info">
                    <i class="fa-solid fa-user-circle"></i>
                    <span>Técnico Responsável</span>
                </div>
            </header>

            <div class="container">
                <!-- Seção: Dashboard -->
                <section id="sec-dashboard" class="page-section">
                    <h3>Visão Geral</h3>
                    <div class="cards-grid">
                        <div class="card">
                            <h4>Equipamentos</h4>
                            <p id="total-equipamentos">0</p>
                        </div>
                        <div class="card">
                            <h4>Chamados Abertos</h4>
                            <p id="total-chamados">0</p>
                        </div>
                    </div>
                </section>

                <!-- Seção: Cadastro e Lista de Equipamentos -->
                <section id="sec-equipamentos" class="page-section hidden">
                    <h3>Gestão de Equipamentos</h3>
                    
                    <form id="form-equipamento" class="form-box">
                        <input type="text" id="eq-nome" placeholder="Nome do Equipamento (ex: Dell Optiplex)" required>
                        <input type="text" id="eq-setor" placeholder="Setor (ex: Financeiro)" required>
                        <select id="eq-status" required>
                            <option value="Em uso">Em uso</option>
                            <option value="Disponível">Disponível</option>
                            <option value="Manutenção">Manutenção</option>
                        </select>
                        <button type="submit" class="btn btn-primary">Cadastrar Equipamento</button>
                    </form>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Setor</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-equipamentos">
                                <!-- Preenchido dinamicamente via JS -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- Seção: Chamados -->
                <section id="sec-chamados" class="page-section hidden">
                    <h3>Central de Chamados</h3>
                    
                    <form id="form-chamado" class="form-box">
                        <input type="text" id="ch-titulo" placeholder="Título do Problema" required>
                        <textarea id="ch-descricao" placeholder="Descrição detalhada" required></textarea>
                        <select id="ch-prioridade" required>
                            <option value="Baixa">Prioridade Baixa</option>
                            <option value="Média">Prioridade Média</option>
                            <option value="Alta">Prioridade Alta</option>
                        </select>
                        <button type="submit" class="btn btn-primary">Abrir Chamado</button>
                    </form>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Título</th>
                                    <th>Prioridade</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-chamados">
                                <!-- Preenchido dinamicamente via JS -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- 1. SDK Supabase Oficial via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Credenciais de Conexão com o Supabase -->
    <script src="js/supabase-config.js"></script>

    <!-- 3. Camada de Funções do Banco de Dados (CRUD) -->
    <script src="js/funcoes.js"></script>

    <!-- 4. Lógica de Interface e Eventos da Aplicação -->
    <script src="js/app.js"></script>
</body>
</html>
